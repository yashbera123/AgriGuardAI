services:
  - type: web
    name: agriguard-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONPATH
        value: "/opt/render/project/src"

  - type: web
    name: agriguard-streamlit
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run streamlit/app.py --server.port=$PORT --server.address=0.0.0.0"
    envVars:
      - key: API_URL
        value: "https://agriguard-api.onrender.com"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
